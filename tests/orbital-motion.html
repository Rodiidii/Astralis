<!doctype html><html lang="fr"><meta charset="utf-8"><title>Contrôle des orbites</title><style>.voyage-space-effects,.voyage-debris,.voyage-destination{display:none}body{margin:0;background:#141324;color:white}.dashboard-studio{position:relative;width:min(1000px,94vw);margin:30px auto}.studio-toolbar{height:40px}.orbit-stage{position:relative;width:100%;height:600px}.orbit-node{position:absolute;left:var(--node-x);top:var(--node-y);transform:translate(-50%,-50%);background:none;color:white;border:0}.celestial-body{display:block;width:var(--regional-size);height:var(--regional-size);border-radius:50%;background:#698ba9;margin:auto}button:focus-visible{outline:1px solid #fff}@media(max-width:600px){.orbit-stage{height:500px}}</style><div class="dashboard-studio" data-studio-game="gi" data-view="orbit" data-editing="false"><nav class="studio-toolbar">Orbites en mouvement</nav><div class="orbit-stage"><button class="orbit-node" data-orbit-select="week"><span class="celestial-body"></span><span class="orbit-node-label">week</span></button><button class="orbit-node" data-orbit-select="banners"><span class="celestial-body"></span><span class="orbit-node-label">banners</span></button><button class="orbit-node" data-orbit-select="wishes"><span class="celestial-body"></span><span class="orbit-node-label">wishes</span></button><button class="orbit-node" data-orbit-select="team"><span class="celestial-body"></span><span class="orbit-node-label">team</span></button><button class="orbit-node" data-orbit-select="session"><span class="celestial-body"></span><span class="orbit-node-label">session</span></button><button class="orbit-node" data-orbit-select="events"><span class="celestial-body"></span><span class="orbit-node-label">events</span></button><button class="orbit-node" data-orbit-select="progress"><span class="celestial-body"></span><span class="orbit-node-label">progress</span></button><button class="orbit-node" data-orbit-select="wall"><span class="celestial-body"></span><span class="orbit-node-label">wall</span></button><button class="orbit-node" data-orbit-select="endgame"><span class="celestial-body"></span><span class="orbit-node-label">endgame</span></button></div><main class="studio-canvas"></main></div><script type="module" src="../src/dashboard-voyage.js"></script></html>
