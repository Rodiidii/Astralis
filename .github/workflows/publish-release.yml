name: Publish Astralis updater
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable update archive
        shell: bash
        run: |
          git fetch --tags --force
          current="${GITHUB_REF_NAME}"
          mapfile -t prior_tags < <(git tag --list 'v*' --sort=-version:refname | grep -Fvx "$current" | head -n 6)
          args=()
          for base in "${prior_tags[@]}"; do args+=(--base-tag "$base"); done
          python scripts/build_release.py "$RUNNER_TEMP/astralis-release" "${args[@]}"
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Astralis ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/astralis-release/Astralis-Update.zip
            ${{ runner.temp }}/astralis-release/Astralis-Update.zip.sha256
            ${{ runner.temp }}/astralis-release/Astralis-Patch-from-*.zip
            ${{ runner.temp }}/astralis-release/Astralis-Patch-from-*.zip.sha256
