name: Refresh published endgame content
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-endgame-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read published rotations
        run: python scripts/export_endgame_feed.py
        env:
          ASTRALIS_HOSTED: '1'
      - name: Publish updated public feed
        run: |
          git config user.name 'Astralis data bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hosting-data/gi-endgame.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh published endgame rotations'
          git pull --rebase origin main
          git push origin HEAD:main
