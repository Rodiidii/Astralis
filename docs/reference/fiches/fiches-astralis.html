<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fiches Astralis — aperçu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--e1:#8fd13f;--e2:#d6f0b0;--e3:#0c150a;--e4:#2f5a16;
--serif:'Cormorant Garamond','Lora',Georgia,serif;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{background:#07080c;color:#eee;font-family:var(--sans)}
.bar{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 20px;background:#0d0f16ee;border-bottom:1px solid #ffffff18}
.bar h1{font:600 15px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#9aa3b8;margin-right:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:7px 13px;border-radius:999px;border:1px solid #ffffff24;font:500 13px var(--sans);color:#c9cfdd;display:flex;gap:7px;align-items:center}
.seg button[aria-pressed=true]{background:var(--e1);color:#10131a;border-color:transparent;font-weight:700}
.seg svg{width:15px;height:15px}
.hint{font:400 12px var(--sans);color:#7f889c;margin-left:auto}
.stage{padding:22px 0 60px;display:flex;justify-content:center}
.fit{position:relative}
.sheet{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;color:#f6f1e7;font-family:var(--sans);font-variant-numeric:tabular-nums lining-nums;box-shadow:0 30px 80px #000a}
.sheet>.bgsvg,.sheet>.bgsvg svg{position:absolute;inset:0;width:100%;height:100%}
.sheet .in{position:absolute;inset:0}
/* briques communes */
.kick{font:600 21px var(--sans);letter-spacing:.32em;text-transform:uppercase;color:color-mix(in srgb,var(--e2) 82%,transparent)}
.kick b{color:var(--e1);font-weight:700}
.ttl{font:700 118px/.95 var(--serif);letter-spacing:-.01em;text-shadow:0 4px 30px color-mix(in srgb,var(--e1) 45%,transparent),0 2px 0 #0006}
.sub{font:500 27px var(--sans);color:color-mix(in srgb,var(--e2) 85%,#fff 0%)}
.sl{display:flex;align-items:center;gap:16px;font:600 21px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:color-mix(in srgb,var(--e2) 88%,transparent)}
.sl .dia{width:11px;height:11px;background:var(--e1);transform:rotate(45deg);box-shadow:0 0 14px var(--e1)}
.sl i{flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--e2) 45%,transparent),transparent)}
.sl em{font:500 20px var(--sans);letter-spacing:.04em;text-transform:none;color:color-mix(in srgb,var(--e2) 65%,transparent);font-style:normal}
.pn{background:linear-gradient(165deg,color-mix(in srgb,var(--e4) 34%,#0b0b12 66%) 0%,color-mix(in srgb,var(--e3) 78%,#000 22%) 100%);border:1.5px solid color-mix(in srgb,var(--e2) 20%,transparent);border-radius:22px;box-shadow:inset 0 1px 0 #ffffff14,0 22px 44px #0007;position:relative;overflow:hidden}
.pn.glow::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--e1) 20%,transparent),transparent 60%);pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px;border-radius:999px;font:600 22px var(--sans);background:color-mix(in srgb,var(--e1) 16%,#0a0a10 84%);border:1.5px solid color-mix(in srgb,var(--e1) 50%,transparent);color:var(--e2)}
.chip svg{width:24px;height:24px}
.ico{display:inline-grid;place-items:center;border-radius:50%;flex:none}
.foot{position:absolute;left:70px;right:70px;bottom:46px;display:flex;justify-content:space-between;align-items:center;font:600 20px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:color-mix(in srgb,var(--e2) 60%,transparent)}
.foot b{color:var(--e2);font-weight:700}
.num{font-family:var(--serif);font-weight:700;font-variant-numeric:lining-nums}
.art{position:absolute;object-fit:cover}
.mut{color:color-mix(in srgb,var(--e2) 60%,transparent)}
</style></head><body>

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

 let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs>

 <radialGradient id="vg" cx=".5" cy=".5" r=".78"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".62"/></radialGradient>

 // lueurs douces décalées
 for(let i=0;i<3;i++)s+=`<ellipse cx="${f(R(.05,.95)*W)}" cy="${f(R(.05,.95)*H)}" rx="${f(R(.18,.34)*W)}" ry="${f(R(.12,.26)*H)}" fill="${i?P.e4:P.e1}" opacity="${i?.5:.26}" filter="url(#bl)" transform="rotate(${f(R(-30,30))} ${W/2} ${H/2})"/>`;

 // astrolabe (coin tiré au sort)
 const cx=(r()<.5?R(-.04,.12):R(.88,1.04))*W,cy=(r()<.5?R(-.06,.2):R(.8,1.06))*H,u=Math.min(W,H)/1000;
 [150,230,310,410,520].forEach((rad,i)=>{const d=rad*u;s+=`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(d)}" fill="none" stroke="${P.e2}" stroke-opacity="${[.22,.14,.18,.1,.08][i]}" stroke-width="${i%2?1.5:2.5}"/>`;
  if(i%2==0)s+=`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(d+14*u)}" fill="none" stroke="${P.e1}" stroke-opacity=".28" stroke-width="${f(12*u)}" stroke-dasharray="${f(1.6*u)} ${f(11*u)}"/>`});
 s+=`<g stroke="${P.e2}" stroke-opacity=".14" stroke-width="1.5"><path d="M${f(cx-560*u)} ${f(cy)}H${f(cx+560*u)}M${f(cx)} ${f(cy-560*u)}V${f(cy+560*u)}"/></g>`;
 const a0=R(0,6.28),a1=a0+R(.9,1.8),rr=310*u;s+=`<path d="M${f(cx+rr*Math.cos(a0))} ${f(cy+rr*Math.sin(a0))}A${f(rr)} ${f(rr)} 0 0 1 ${f(cx+rr*Math.cos(a1))} ${f(cy+rr*Math.sin(a1))}" fill="none" stroke="${P.e1}" stroke-opacity=".7" stroke-width="${f(4*u)}" stroke-linecap="round"/>`;
 // glyphe filigrane géant
 const gs=Math.min(W,H)*R(.5,.75);s+=`<g transform="translate(${f(R(.1,.7)*W)} ${f(R(.15,.6)*H)}) rotate(${f(R(-18,18))}) scale(${f(gs/24)})" fill="none" stroke="${P.e2}" stroke-opacity=".055" stroke-width="${f(.55)}" stroke-linejoin="round">${GL[el]}</g>`;
 // motif propre à l'élément
 const M={
  pyro(){let o='';for(let i=0;i<46;i++){const x=R(0,W),y=R(.15,1)*H,q=R(1.5,6.5);o+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(q)}" fill="${i%5?P.e1:P.e2}" opacity="${f(R(.2,.8))}"/>`;if(q>4)o+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(q*3)}" fill="${P.e1}" opacity=".08"/>`}
   for(let i=0;i<5;i++){const x=R(0,W),y=R(.5,1)*H;o+=`<path d="M${f(x)} ${f(y)}c${f(R(-60,60))} ${f(-R(80,160))} ${f(R(-80,80))} ${f(-R(200,380))} ${f(R(-30,30))} ${f(-R(300,520))}" fill="none" stroke="${P.e1}" stroke-opacity=".16" stroke-width="${f(R(2,6))}" stroke-linecap="round"/>`}return o},
  hydro(){let o='';for(let k=0;k<3;k++){const x=R(0,W),y=R(.1,.95)*H;for(let i=1;i<=7;i++)o+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(i*R(38,52))}" fill="none" stroke="${P.e1}" stroke-opacity="${f(.2-i*.02)}" stroke-width="2"/>`}

   for(let i=0;i<7;i++){const x=R(0,W),y=R(0,H);o+=`<path d="M${f(x)} ${f(y)}h${f(R(160,420))}a40 40 0 1 0 -40 -40" fill="none" stroke="${P.e2}" stroke-opacity=".16" stroke-width="3" stroke-linecap="round"/>`}return o},

  dendro(){let o='';for(let k=0;k<6;k++){const left=r()<.5,x0=left?R(-30,.15*W):R(.85*W,W+30),y0=R(.05,.95)*H,dx=(left?1:-1);let x=x0,y=y0,p=`M${f(x)} ${f(y)}`;

const TABS=[['team','Équipe'],['comp','Comparatif d\'équipe'],['lab','Laboratoire'],['build','Build'],['farm','Plan de farm']];
let cur='team',curEl='cryo';
function mount(){
 const S=SHEETS[cur],P=EL[curEl],sh=document.getElementById('sheet');
 for(const k of['e1','e2','e3','e4'])document.documentElement.style.setProperty('--'+k,P[k]);
 sh.style.width=S.W+'px';sh.style.height=S.H+'px';
 sh.innerHTML='<div class="bgsvg">'+backdrop(S.W,S.H,curEl,S.seed)+'</div>'+S.html(curEl);
 fit();document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k==cur));
 document.querySelectorAll('#els button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k==curEl));
}
function fit(){const S=SHEETS[cur],sc=Math.min(1,(innerWidth-40)/S.W);const sh=document.getElementById('sheet'),f=document.getElementById('fit');sh.style.transform=`scale(${sc})`;f.style.width=S.W*sc+'px';f.style.height=S.H*sc+'px'}
document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join('');
document.getElementById('els').innerHTML=Object.entries(EL).map(([k,v])=>`<button data-k="${k}">${G(k,15,'currentColor',2)}${v.n}</button>`).join('');
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(b){cur=b.dataset.k;mount()}};
document.getElementById('els').onclick=e=>{const b=e.target.closest('button');if(b){curEl=b.dataset.k;mount()}};
addEventListener('resize',fit);
const q=new URLSearchParams(location.search);if(q.get('s'))cur=q.get('s');if(q.get('e'))curEl=q.get('e');
