services:
  - type: web
    name: astralis-prive
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ASTRALIS_HOSTED
        value: "true"
      - key: ASTRALIS_ACCESS_PASSWORD
        generateValue: true
